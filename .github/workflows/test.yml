name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Static analysis
        run: go vet ./...

      - name: Default test baseline
        run: go test ./...

      - name: Default race baseline
        run: go test -race ./...

      - name: Compile integration suite
        run: go test -tags=integration -run '^$' ./...
