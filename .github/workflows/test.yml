name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile all packages and tests
        run: go test -run '^$' ./...

      - name: Environment-independent tests
        run: |
          go test ./taskx
          go test ./resourcex -run '^TestResource'
          go test ./redisx -run '^TestRedisClientWiring$'
          go test ./mongox -run '^TestMongoDatabaseWiring$'
          go test ./ormx -run '^TestOrmxDatabaseWiring$'
          go test ./webx
          go test ./webx/middleware/accesslog
          go test ./webx/middleware/auth
          go test ./webx/middleware/hashresponse

      - name: Environment-independent race tests
        run: |
          go test -race ./resourcex -run '^TestResource'
          go test -race ./redisx -run '^TestRedisClientWiring$'
          go test -race ./mongox -run '^TestMongoDatabaseWiring$'
          go test -race ./ormx -run '^TestOrmxDatabaseWiring$'
          go test -race ./webx ./webx/middleware/accesslog ./webx/middleware/auth ./webx/middleware/hashresponse
