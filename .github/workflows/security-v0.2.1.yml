name: security-v0.3.0

on:
  push:
    branches:
      - security/v0.2.1

permissions:
  contents: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Upgrade vulnerable dependencies
        run: |
          go mod edit -go=1.25
          go get \
            github.com/go-viper/mapstructure/v2@v2.4.0 \
            golang.org/x/crypto@v0.51.0 \
            filippo.io/edwards25519@v1.1.1 \
            github.com/jackc/pgx/v5@v5.9.0 \
            go.mongodb.org/mongo-driver@v1.17.7 \
            golang.org/x/net@v0.55.0
          go mod tidy
      - name: Commit resolved module graph
        run: |
          rm .github/workflows/security-v0.2.1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'security: upgrade vulnerable dependencies'
          git push origin HEAD:security/v0.2.1
