name: dependabot-remediation

on:
  push:
    branches:
      - security/dependabot-audit

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true

      - name: Upgrade vulnerable toolchain baseline and modules
        run: |
          go mod edit -go=1.25.13
          go get \
            github.com/jackc/pgx/v5@v5.9.2 \
            github.com/klauspost/compress@v1.18.7 \
            golang.org/x/crypto@v0.55.0 \
            golang.org/x/net@v0.57.0 \
            golang.org/x/text@v0.39.0
          go mod tidy

      - name: Verify reachable vulnerabilities are gone
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Commit remediation
        run: |
          rm .github/workflows/dependabot-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'security: remediate remaining Go vulnerabilities'
          git push origin HEAD:security/dependabot-audit
