name: dependabot-audit

on:
  push:
    branches:
      - security/dependabot-audit

permissions:
  contents: read
  security-events: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Read open Dependabot alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&per_page=100" > alerts.json

          echo '=== OPEN DEPENDABOT ALERTS ==='
          jq -r '.[] | [
            (.number|tostring),
            .dependency.package.name,
            .dependency.manifest_path,
            .security_advisory.severity,
            (.security_advisory.cve_id // .security_advisory.ghsa_id),
            .security_vulnerability.vulnerable_version_range,
            (.security_vulnerability.first_patched_version.identifier // "NO_PATCH")
          ] | @tsv' alerts.json

          echo "OPEN_ALERT_COUNT=$(jq 'length' alerts.json)"
