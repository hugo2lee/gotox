name: module-normalize

on:
  push:
    branches:
      - security/module-audit

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Restore unrelated x/arch version
        run: |
          go get golang.org/x/arch@v0.18.0
          go mod download

      - name: Recheck security gates
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

          go list -m -f '{{if not .Main}}{{.Path}}|{{.Version}}{{end}}' all | sed '/^$/d' > /tmp/modules.txt
          python3 - <<'PY'
          import json, sys, urllib.request
          findings = []
          for raw in open('/tmp/modules.txt', encoding='utf-8'):
              raw = raw.strip()
              if not raw:
                  continue
              name, version = raw.rsplit('|', 1)
              if not version:
                  continue
              req = urllib.request.Request(
                  'https://api.osv.dev/v1/query',
                  data=json.dumps({'package': {'ecosystem': 'Go', 'name': name}, 'version': version}).encode(),
                  headers={'Content-Type': 'application/json'},
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  result = json.load(resp)
              for vuln in result.get('vulns', []):
                  aliases = vuln.get('aliases', [])
                  external = [a for a in aliases if a.startswith('CVE-') or a.startswith('GHSA-')]
                  if external:
                      findings.append((name, version, vuln.get('id'), external))
          print(f'RESIDUAL_EXTERNAL_FINDING_COUNT={len(findings)}')
          for item in findings:
              print(item)
          if findings:
              sys.exit(1)
          PY

      - name: Commit minimized module graph
        run: |
          rm .github/workflows/module-normalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: minimize dependency security diff'
          git push origin HEAD:security/module-audit
