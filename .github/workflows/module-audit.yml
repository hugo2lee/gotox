name: module-audit

on:
  push:
    branches:
      - security/module-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Explain security-sensitive module paths
        run: |
          echo '=== WHY x/crypto ==='
          go mod why -m golang.org/x/crypto || true
          echo '=== WHY x/net ==='
          go mod why -m golang.org/x/net || true
          echo '=== WHY klauspost/compress ==='
          go mod why -m github.com/klauspost/compress || true

      - name: Scan every resolved Go module with OSV
        run: |
          go list -m -f '{{if not .Main}}{{.Path}}|{{.Version}}{{end}}' all | sed '/^$/d' > modules.txt
          python3 - <<'PY'
          import json
          import urllib.request

          findings = []
          with open('modules.txt', encoding='utf-8') as f:
              modules = []
              for raw in f:
                  raw = raw.strip()
                  if not raw:
                      continue
                  name, version = raw.rsplit('|', 1)
                  if version:
                      modules.append((name, version))

          for name, version in modules:
              payload = json.dumps({
                  'package': {'ecosystem': 'Go', 'name': name},
                  'version': version,
              }).encode()
              req = urllib.request.Request(
                  'https://api.osv.dev/v1/query',
                  data=payload,
                  headers={'Content-Type': 'application/json'},
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  result = json.load(resp)

              for vuln in result.get('vulns', []):
                  fixed = set()
                  for affected in vuln.get('affected', []):
                      pkg = affected.get('package', {})
                      if pkg.get('ecosystem') != 'Go' or pkg.get('name') != name:
                          continue
                      for rng in affected.get('ranges', []):
                          for event in rng.get('events', []):
                              if event.get('fixed'):
                                  fixed.add(event['fixed'])
                  findings.append({
                      'module': name,
                      'version': version,
                      'id': vuln.get('id'),
                      'aliases': vuln.get('aliases', []),
                      'summary': vuln.get('summary', ''),
                      'fixed': sorted(fixed),
                  })

          print('=== OSV MODULE FINDINGS ===')
          for item in findings:
              print(json.dumps(item, ensure_ascii=False, sort_keys=True))
          print(f'OSV_FINDING_COUNT={len(findings)}')
          PY
