name: module-remediation

on:
  push:
    branches:
      - security/module-audit

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Upgrade residual vulnerable modules
        run: |
          go get \
            gopkg.in/yaml.v2@v2.4.0 \
            golang.org/x/arch@v0.30.0
          go mod tidy

          # Security floors for modules that remain in the resolved build list
          # through upstream go.mod requirements even though gotox does not
          # import their packages directly. Do not run tidy after these pins.
          go get \
            github.com/yuin/goldmark@v1.8.5 \
            golang.org/x/mod@v0.40.0
          go mod download

      - name: Verify reachable vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Verify no CVE or GHSA findings remain in resolved modules
        run: |
          go list -m -f '{{if not .Main}}{{.Path}}|{{.Version}}{{end}}' all | sed '/^$/d' > modules.txt
          python3 - <<'PY'
          import json
          import sys
          import urllib.request

          findings = []
          go_only = []
          for raw in open('modules.txt', encoding='utf-8'):
              raw = raw.strip()
              if not raw:
                  continue
              name, version = raw.rsplit('|', 1)
              if not version:
                  continue
              req = urllib.request.Request(
                  'https://api.osv.dev/v1/query',
                  data=json.dumps({
                      'package': {'ecosystem': 'Go', 'name': name},
                      'version': version,
                  }).encode(),
                  headers={'Content-Type': 'application/json'},
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  result = json.load(resp)
              for vuln in result.get('vulns', []):
                  aliases = vuln.get('aliases', [])
                  external = [a for a in aliases if a.startswith('CVE-') or a.startswith('GHSA-')]
                  item = {
                      'module': name,
                      'version': version,
                      'id': vuln.get('id'),
                      'aliases': aliases,
                      'summary': vuln.get('summary', ''),
                  }
                  if external:
                      findings.append(item)
                  else:
                      go_only.append(item)

          print('=== RESIDUAL CVE/GHSA FINDINGS ===')
          for item in findings:
              print(json.dumps(item, ensure_ascii=False, sort_keys=True))
          print(f'RESIDUAL_EXTERNAL_FINDING_COUNT={len(findings)}')

          print('=== GO-ONLY ADVISORIES ===')
          for item in go_only:
              print(json.dumps(item, ensure_ascii=False, sort_keys=True))
          print(f'GO_ONLY_ADVISORY_COUNT={len(go_only)}')

          if findings:
              sys.exit(1)
          PY

      - name: Explain any Go-only residuals
        run: |
          echo '=== WHY x/crypto ==='
          go mod why -m golang.org/x/crypto || true
          echo '=== WHY rsc.io/pdf ==='
          go mod why -m rsc.io/pdf || true

      - name: Commit final module graph
        run: |
          rm .github/workflows/module-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'security: clear residual module CVEs'
          git push origin HEAD:security/module-audit
