name: module-audit

on:
  push:
    branches:
      - security/module-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Trace residual vulnerable modules
        run: |
          for module in \
            golang.org/x/crypto \
            github.com/yuin/goldmark \
            golang.org/x/mod \
            gopkg.in/yaml.v2 \
            rsc.io/pdf; do
            echo "=== WHY ${module} ==="
            go mod why -m "${module}" || true
            echo "=== GRAPH PARENTS ${module} ==="
            go mod graph | grep " ${module}@" || true
          done

          echo '=== AVAILABLE UPDATES ==='
          go list -m -u \
            github.com/yuin/goldmark \
            golang.org/x/mod \
            gopkg.in/yaml.v2 \
            rsc.io/pdf \
            golang.org/x/crypto || true
