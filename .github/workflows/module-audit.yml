name: module-audit

on:
  push:
    branches:
      - security/module-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Trace x/arch and x/tools residuals
        run: |
          for module in golang.org/x/arch golang.org/x/tools rsc.io/pdf github.com/yuin/goldmark; do
            echo "=== WHY ${module} ==="
            go mod why -m "${module}" || true
            echo "=== GRAPH PARENTS ${module} ==="
            go mod graph | grep " ${module}@" || true
          done

          echo '=== AVAILABLE UPDATES ==='
          go list -m -u \
            golang.org/x/arch \
            golang.org/x/tools \
            github.com/yuin/goldmark \
            golang.org/x/mod \
            gopkg.in/yaml.v2 || true
